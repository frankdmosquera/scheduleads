# A copy of the live database every 6 hours, locked and kept outside Railway in R2 (12c).
# Folders and how long R2 keeps them: 6h/ 3 days, daily/ 14, weekly/ 60, monthly/ 365.
# Never prints a secret or any data: only the copy's size and its number of tables.

name: Database backup

on:
  schedule:
    - cron: "0 */6 * * *" # 00, 06, 12, 18 UTC
  workflow_dispatch:
  # Temporary, to prove the job before it is on main (scheduled runs start only from main).
  # Removed before 12c is merged.
  push:
    branches: [feature/12c-backups-and-restore]
    paths: [.github/workflows/database-backup.yml]

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # pg_dump must be at least the server's version (18); Ubuntu's own client is older.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 > /dev/null

      - name: Copy, lock and store
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 refuses the newer checksum headers the aws tool sends by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          for name in BACKUP_DATABASE_URL BACKUP_PASSPHRASE R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name"; exit 1; fi
          done
          pg=/usr/lib/postgresql/18/bin

          "$pg/pg_dump" --format=custom --dbname="$BACKUP_DATABASE_URL" --file=copy.dump

          # An empty or broken copy must fail the run, never be stored as if it were good.
          size=$(stat -c%s copy.dump)
          tables=$("$pg/pg_restore" --list copy.dump | grep -c " TABLE " || true)
          echo "Copy: $size bytes, $tables tables"
          if [ "$size" -lt 10240 ] || [ "$tables" -eq 0 ]; then
            echo "Refusing to store a copy under 10 KB or with no tables."
            exit 1
          fi

          # The passphrase goes in through a file descriptor, never the command line.
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output copy.dump.gpg copy.dump 3<<< "$BACKUP_PASSPHRASE"
          rm copy.dump

          # The 6-hour slot, not the clock, decides the folders, so a late start still counts.
          hour=$(date -u +%H)
          slot=$(( 10#$hour / 6 * 6 ))
          folders="6h"
          if [ "$slot" -eq 0 ]; then
            folders="$folders daily"
            if [ "$(date -u +%u)" -eq 7 ]; then folders="$folders weekly"; fi
            if [ "$(date -u +%d)" = "01" ]; then folders="$folders monthly"; fi
          fi

          # Minutes in the name: the lock refuses an overwrite, so two runs must never share one.
          key="$(date -u +%Y-%m-%dT%H%M)Z.dump.gpg"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for folder in $folders; do
            aws s3 cp copy.dump.gpg "s3://scheduleads-backups/$folder/$key" \
              --endpoint-url "$endpoint" --only-show-errors
            echo "Stored $folder/$key"
          done
